services:
  mysql:
    image: mysql:8.0
    container_name: qynova-erp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-qynova_erp}
      MYSQL_USER: ${DB_USER:-qynova_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-qynova_pass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - qynova-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: qynova-erp-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-qynova_user}
      DB_PASSWORD: ${DB_PASSWORD:-qynova_pass}
      DB_NAME: ${DB_NAME:-qynova_erp}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_access_key_min_32_chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_secret_jwt_refresh_key_min_32_chars}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@qynova.erp}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - qynova-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: qynova-erp-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - qynova-network

volumes:
  mysql_data:
    driver: local

networks:
  qynova-network:
    driver: bridge
